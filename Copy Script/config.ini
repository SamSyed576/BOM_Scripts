; ============================================================
; BOM Copy Tool - Configuration File
; ============================================================
; Edit the values below. Do not remove section headers ([Paths], etc).
; Lines starting with ; are comments and are ignored.

[Paths]
; Full path to the BOM extraction report
BOMReportFolder=D:\Princecraft\files

; Full path to the destination folder where files will be copied
DestinationPath=D:\Princecraft\Copy Destination

[BOM]
; Column headers in the BOM report CSV that contain the full file paths
; Change these if your report uses different column names
ParentPathColumn=ParentPath
ChildPathColumn=ChildPath

; CSV delimiter
; Your BOM uses |
;Delimiter=Auto

[Settings]
; Which copy tool to use: XCOPY or ROBOCOPY
CopyTool=XCOPY

; Preserve full source folder structure under DestinationPath (true/false)
; If false, all files are copied flat into DestinationPath (name clashes possible)
PreserveFolderStructure=false

; Automatically run the generated batch file after creating it (true/false)
; If false, the .bat file is only generated for you to review and run manually
AutoRun=false

[XCOPY]
; XCOPY switches used for every file copy
; /Y  = suppress overwrite confirmation
; /C  = continue copying even if an error occurs
; /I  = assume destination is a directory when copying to a nonexistent path
; /H  = copy hidden/system files too
; /R  = overwrite read-only files
; /D  = copy only files changed on or after a date (omit if you want a full copy every time)
Switches=/Y /C /H /D

[ROBOCOPY]
; ROBOCOPY switches used for every file copy (if CopyTool=ROBOCOPY)
; /R:2  = retry 2 times on failed copies
; /W:5  = wait 5 seconds between retries
; /NP   = no progress percentage in log (keeps log file readable)
; /NFL  = no file list in console output (log file still records the actual copy line)
Switches=/R:2 /W:5 /NP
